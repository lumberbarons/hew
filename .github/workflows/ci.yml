name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      # The action only runs `golangci-lint run`, which never checks
      # formatting. It does put the binary it installed on PATH, so the
      # formatters configured in .golangci.yml are gated here instead.
      - name: formatting
        run: golangci-lint fmt --diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The opencode plugin hew installs is JavaScript, and TestOpencodePluginRuns
      # executes it under node rather than grepping its source. Installed
      # explicitly instead of relying on whatever the runner image happens to
      # ship, because that test skips when node is missing — a silent skip here
      # would leave the plugin's only behavioral coverage unrun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: go test -race -coverprofile=coverage.out ./...
      - name: coverage gate
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

  # `tracker` is a library API, not just an internal package: a consumer
  # imports it in-process (DESIGN.md, "Tracker library"), so an exported symbol
  # that disappears is a compile error there even though every CLI command
  # still works. This is the library's counterpart to the CLI surface snapshot
  # (#167), except the "old" surface is whatever the base commit exported
  # rather than a committed golden, which is why it needs a tool.
  #
  # It annotates rather than fails on purpose. The API is experimental until
  # 1.0, and DESIGN.md makes a deliberate breaking change a `feat!:`/`fix!:`
  # commit that the release notes file under Breaking changes — a change to
  # announce, not one to forbid. The 1.0 compatibility policy (#171) decides
  # whether this same diff should block a merge; until then the job's contract
  # is that a removal is visible in review instead of surfacing in a
  # consumer's build.
  api-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit's tree is half of the comparison, and a shallow
          # checkout does not carry it.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # apidiff lives in x/exp, which promises no compatibility of its own:
      # flags and output shape move between commits. The pseudo-version's
      # suffix is the commit it was cut from, and pinning it avoids the failure
      # mode govulncheck's pin documents above — @latest resolving to a tool
      # release that refuses to build under the toolchain go.mod pins.
      - run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261113113407-e3970619a1a4
      # The base commit's exported surface is written to an export-data file,
      # then compared with the package in the working tree. apidiff exits 0
      # whether or not it found anything, so its output is the signal, not its
      # status. `-incompatible` prints exactly the changes worth annotating,
      # one line each; the full diff, additions included, goes to the run
      # summary where a reviewer reads it beside the PR.
      - name: diff the tracker API against the base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base_commit="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [ -z "$base_commit" ] || [ "$base_commit" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no base commit to compare against; nothing to diff"
            exit 0
          fi

          # The event's base can be a commit this checkout does not carry: the
          # base branch moved between the event and the job, or a force-push
          # rewrote it. Ask for it once; a commit the repository no longer has
          # is nothing to compare, not a failed check.
          if ! git cat-file -e "$base_commit^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$base_commit" || true
          fi
          if ! git cat-file -e "$base_commit^{commit}" 2>/dev/null; then
            echo "::notice::$base_commit is not in this repository; skipping the diff"
            exit 0
          fi

          base_tree="$RUNNER_TEMP/hew-base"
          export_file="$RUNNER_TEMP/base.export"
          git worktree add --quiet --detach "$base_tree" "$base_commit"
          trap 'git worktree remove --force "$base_tree"' EXIT

          if [ ! -d "$base_tree/tracker" ]; then
            echo "::notice::$base_commit predates the tracker package; every symbol is new"
            exit 0
          fi

          # apidiff resolves an import path through the module in the working
          # directory, so the base's export data has to be written from inside
          # the base tree.
          ( cd "$base_tree" && apidiff -w "$export_file" github.com/lumberbarons/hew/tracker )

          changes="$(apidiff "$export_file" github.com/lumberbarons/hew/tracker)"
          if [ -z "$changes" ]; then
            echo "tracker API: unchanged since $base_commit"
            exit 0
          fi

          {
            echo "### tracker API surface"
            echo
            echo "Changes against \`$base_commit\`:"
            echo
            echo '```'
            printf '%s\n' "$changes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          incompatible="$(apidiff -incompatible "$export_file" github.com/lumberbarons/hew/tracker)"
          if [ -z "$incompatible" ]; then
            echo "tracker API: additions only"
            printf '%s\n' "$changes"
            exit 0
          fi

          # One annotation per removal, so the change shows up on the PR rather
          # than only in a log nobody opened. Percent signs are escaped because
          # a workflow command treats them as escapes.
          while IFS= read -r change; do
            echo "::warning title=tracker API change::${change//'%'/'%25'}"
          done <<< "$incompatible"
          echo "tracker API: incompatible changes since $base_commit, annotated above"

  # evals/ is its own module, so the root job's ./... never reaches it.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: evals
      # Same reason as the lint job: the action never checks formatting, and
      # the root job's formatting step does not reach a nested module.
      - name: formatting
        run: golangci-lint fmt --diff
        working-directory: evals
      - run: go test -race ./...
        working-directory: evals

  # Scoped to the root module deliberately: evals/ is a harness that is never
  # shipped (`go install .../cmd/hew` does not pull it), so its dependencies
  # carry no user-facing risk.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck is installed at an explicit version rather than @latest.
      # The scan's point is to report advisories against the toolchain go.mod
      # pins, and @latest can resolve to a tool release that refuses to build
      # under it (x/vuln v1.8.0 requires go 1.26) — which fails the job at
      # install time, before any scanning happens. The vulnerability database
      # still updates at run time, so the pin costs analysis features, not
      # advisories. Raise it when the go directive moves.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  # A broken .goreleaser.yaml, or a target that quietly stops cross-compiling,
  # would otherwise surface only when a tag is pushed — too late, since the tag
  # is already public and immutable.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads tags to derive the snapshot version and warns on a
          # shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          install-only: true
      - run: goreleaser check
      - run: goreleaser build --snapshot --clean

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # The actionlint version itself floats, as golangci-lint's does —
          # the action ref is what we pin.
          #
          # examples/auto-triage.yml ships to users and is documented in the
          # README, so it is linted alongside our own workflows even though it
          # lives outside .github/workflows.
          files: .github/workflows/*.yml, examples/auto-triage.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh
