name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      # The action only runs `golangci-lint run`, which never checks
      # formatting. It does put the binary it installed on PATH, so the
      # formatters configured in .golangci.yml are gated here instead.
      - name: formatting
        run: golangci-lint fmt --diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The opencode plugin hew installs is JavaScript, and TestOpencodePluginRuns
      # executes it under node rather than grepping its source. Installed
      # explicitly instead of relying on whatever the runner image happens to
      # ship, because that test skips when node is missing — a silent skip here
      # would leave the plugin's only behavioral coverage unrun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: go test -race -coverprofile=coverage.out ./...
      - name: coverage gate
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

  # evals/ is its own module, so the root job's ./... never reaches it.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: evals
      # Same reason as the lint job: the action never checks formatting, and
      # the root job's formatting step does not reach a nested module.
      - name: formatting
        run: golangci-lint fmt --diff
        working-directory: evals
      - run: go test -race ./...
        working-directory: evals

  # Scoped to the root module deliberately: evals/ is a harness that is never
  # shipped (`go install .../cmd/hew` does not pull it), so its dependencies
  # carry no user-facing risk.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck is installed at an explicit version rather than @latest.
      # The scan's point is to report advisories against the toolchain go.mod
      # pins, and @latest can resolve to a tool release that refuses to build
      # under it (x/vuln v1.8.0 requires go 1.26) — which fails the job at
      # install time, before any scanning happens. The vulnerability database
      # still updates at run time, so the pin costs analysis features, not
      # advisories. Raise it when the go directive moves.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  # A broken .goreleaser.yaml, or a target that quietly stops cross-compiling,
  # would otherwise surface only when a tag is pushed — too late, since the tag
  # is already public and immutable.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads tags to derive the snapshot version and warns on a
          # shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          install-only: true
      - run: goreleaser check
      - run: goreleaser build --snapshot --clean

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # The actionlint version itself floats, as golangci-lint's does —
          # the action ref is what we pin.
          #
          # examples/auto-triage.yml ships to users and is documented in the
          # README, so it is linted alongside our own workflows even though it
          # lives outside .github/workflows.
          files: .github/workflows/*.yml, examples/auto-triage.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh
