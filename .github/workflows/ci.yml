name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      # The action only runs `golangci-lint run`, which never checks
      # formatting. It does put the binary it installed on PATH, so the
      # formatters configured in .golangci.yml are gated here instead.
      - name: formatting
        run: golangci-lint fmt --diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The opencode plugin hew installs is JavaScript, and TestOpencodePluginRuns
      # executes it under node rather than grepping its source. Installed
      # explicitly instead of relying on whatever the runner image happens to
      # ship, because that test skips when node is missing — a silent skip here
      # would leave the plugin's only behavioral coverage unrun.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: go test -race -coverprofile=coverage.out ./...
      # The consumer scenarios are the only tests of much of `pr` and
      # `migrate` (#317 moved their external tests out of the root module),
      # and the root run never executes them. -coverpkg attributes their
      # statements to the root module's packages, and the gate merges this
      # profile with the root one (see .testcoverage.yml). The `consumer` job
      # below still runs the scenarios for pass/fail; this run exists only to
      # measure them.
      - name: consumer coverage
        run: go test -race -coverpkg=github.com/lumberbarons/hew/... -coverprofile=../coverage-consumer.out ./...
        working-directory: consumer
      - name: coverage gate
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

  # `tracker`, `pr` and `migrate` are a library API, not just internal
  # packages: a consumer imports them in-process (DESIGN.md, "Tracker
  # library"), so an exported symbol that disappears is a compile error there
  # even though every CLI command still works. This is the library's
  # counterpart to the CLI surface snapshot (#167), except the "old" surface is
  # whatever the base commit exported rather than a committed golden, which is
  # why it needs a tool. #317 extended it from `tracker` alone to every public
  # package.
  #
  # It annotates rather than fails on purpose. The API is experimental until
  # 1.0, and DESIGN.md makes a deliberate breaking change a `feat!:`/`fix!:`
  # commit that the release notes file under Breaking changes — a change to
  # announce, not one to forbid. The 1.0 compatibility policy (#171) decides
  # whether this same diff should block a merge; until then the job's contract
  # is that a removal is visible in review instead of surfacing in a
  # consumer's build.
  api-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit's tree is half of the comparison, and a shallow
          # checkout does not carry it.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # apidiff lives in x/exp, which promises no compatibility of its own:
      # flags and output shape move between commits. The pseudo-version's
      # suffix is the commit it was cut from, and pinning it avoids the failure
      # mode govulncheck's pin documents above — @latest resolving to a tool
      # release that refuses to build under the toolchain go.mod pins.
      - run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261113113407-e3970619a1a4
      # The base commit's exported surface is written to an export-data file,
      # then compared with the package in the working tree. apidiff exits 0
      # whether or not it found anything, so its output is the signal, not its
      # status. `-incompatible` prints exactly the changes worth annotating,
      # one line each; the full diff, additions included, goes to the run
      # summary where a reviewer reads it beside the PR.
      - name: diff the public API against the base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base_commit="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [ -z "$base_commit" ] || [ "$base_commit" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no base commit to compare against; nothing to diff"
            exit 0
          fi

          # The event's base can be a commit this checkout does not carry: the
          # base branch moved between the event and the job, or a force-push
          # rewrote it. Ask for it once; a commit the repository no longer has
          # is nothing to compare, not a failed check.
          if ! git cat-file -e "$base_commit^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$base_commit" || true
          fi
          if ! git cat-file -e "$base_commit^{commit}" 2>/dev/null; then
            echo "::notice::$base_commit is not in this repository; skipping the diff"
            exit 0
          fi

          base_tree="$RUNNER_TEMP/hew-base"
          git worktree add --quiet --detach "$base_tree" "$base_commit"
          trap 'git worktree remove --force "$base_tree"' EXIT

          for pkg in tracker pr migrate; do
            if [ ! -d "$base_tree/$pkg" ]; then
              echo "::notice::$base_commit predates the $pkg package; every symbol is new"
              continue
            fi

            # apidiff resolves an import path through the module in the working
            # directory, so the base's export data has to be written from
            # inside the base tree.
            export_file="$RUNNER_TEMP/$pkg.export"
            ( cd "$base_tree" && apidiff -w "$export_file" "github.com/lumberbarons/hew/$pkg" )

            changes="$(apidiff "$export_file" "github.com/lumberbarons/hew/$pkg")"
            if [ -z "$changes" ]; then
              echo "$pkg API: unchanged since $base_commit"
              continue
            fi

            {
              echo "### $pkg API surface"
              echo
              echo "Changes against \`$base_commit\`:"
              echo
              echo '```'
              printf '%s\n' "$changes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            incompatible="$(apidiff -incompatible "$export_file" "github.com/lumberbarons/hew/$pkg")"
            if [ -z "$incompatible" ]; then
              echo "$pkg API: additions only"
              printf '%s\n' "$changes"
              continue
            fi

            # One annotation per removal, so the change shows up on the PR
            # rather than only in a log nobody opened. Percent signs are
            # escaped because a workflow command treats them as escapes.
            while IFS= read -r change; do
              echo "::warning title=$pkg API change::${change//'%'/'%25'}"
            done <<< "$incompatible"
            echo "$pkg API: incompatible changes since $base_commit, annotated above"
          done

  # The consumer module is outside the hew module on purpose: it can import
  # only `tracker`, `pr` and `migrate`, so a workflow that needs an internal
  # type fails to compile here instead of passing its own unit tests. It is the
  # completion gate DESIGN.md's "Tracker library" contract promises (#317):
  # initialization, queries, creation, claims, dependencies, plans, pull
  # requests and both migrations, against a real local tracker and an isolated
  # GitHub transport. No hew binary is installed or built for it.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A hew binary on PATH would let a test pass by shelling out instead of
      # importing the library, which is the one thing this job exists to
      # forbid. The runner does not install one; this asserts it stays that way.
      - name: no hew executable on the workflow path
        run: |
          if command -v hew >/dev/null 2>&1; then
            echo "::error::the consumer must build against the library, not a hew binary"
            exit 1
          fi
      # The module replaces hew with the checkout, so its go.mod and go.sum
      # must agree with the root's requirements.
      - name: module is tidy
        run: go mod tidy -diff
        working-directory: consumer
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: consumer
      # Same reason as the lint job: the action never checks formatting, and
      # the root job's formatting step does not reach a nested module.
      - name: formatting
        run: golangci-lint fmt --diff
        working-directory: consumer
      - run: go test -race ./...
        working-directory: consumer

  # daemon/ is a long-running consumer of the same public packages: a REST API
  # and web UI over a tracker. Like consumer/ it is a separate module that
  # cannot name internal/*, and like evals/ it is outside the root job's
  # ./..., the coverage gate and goreleaser, so it needs its own gates,
  # including its own coverage floor.
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The module replaces hew with the checkout, so its go.mod and go.sum
      # must agree with the root's requirements.
      - name: module is tidy
        run: go mod tidy -diff
        working-directory: daemon
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: daemon
      # Same reason as the lint job: the action never checks formatting, and
      # the root job's formatting step does not reach a nested module.
      - name: formatting
        run: golangci-lint fmt --diff
        working-directory: daemon
      - run: go test -race -coverprofile=coverage-daemon.out ./...
        working-directory: daemon
      # The same floor and action as the root module's gate. The action runs
      # from the repository root, so the config's profile path is relative to
      # it and source-dir points at the module whose import path to strip.
      - name: coverage gate
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./daemon/.testcoverage.yml
          source-dir: ./daemon

  # The daemon's web UI (daemon/web) is Vite, React and TypeScript, so it has
  # its own gates: types, lint, format, unit tests held to the same 90% floor
  # as the Go code, and a production build. The end-to-end specs then drive
  # that build in a real browser against the real daemon binary, with a
  # throwaway local tracker, which is the check that the two ends still agree.
  # The unit tests render from fixtures the Go tests generate and verify
  # (daemon/web/src/fixtures), so a changed response shape fails one side or
  # the other instead of shipping.
  daemon-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: daemon/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - name: unit tests and coverage floor
        run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: end-to-end
        run: npm run e2e

  # evals/ is its own module, so the root job's ./... never reaches it.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: evals
      # Same reason as the lint job: the action never checks formatting, and
      # the root job's formatting step does not reach a nested module.
      - name: formatting
        run: golangci-lint fmt --diff
        working-directory: evals
      - run: go test -race ./...
        working-directory: evals

  # Scoped to the root module deliberately: evals/ is a harness that is never
  # shipped (`go install .../cmd/hew` does not pull it), so its dependencies
  # carry no user-facing risk.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck is installed at an explicit version rather than @latest.
      # The scan's point is to report advisories against the toolchain go.mod
      # pins, and @latest can resolve to a tool release that refuses to build
      # under it (x/vuln v1.8.0 requires go 1.26) — which fails the job at
      # install time, before any scanning happens. The vulnerability database
      # still updates at run time, so the pin costs analysis features, not
      # advisories. Raise it when the go directive moves.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  # A broken .goreleaser.yaml, or a target that quietly stops cross-compiling,
  # would otherwise surface only when a tag is pushed — too late, since the tag
  # is already public and immutable.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads tags to derive the snapshot version and warns on a
          # shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          install-only: true
      - run: goreleaser check
      - run: goreleaser build --snapshot --clean

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # The actionlint version itself floats, as golangci-lint's does —
          # the action ref is what we pin.
          #
          # examples/auto-triage.yml ships to users and is documented in the
          # README, so it is linted alongside our own workflows even though it
          # lives outside .github/workflows.
          files: .github/workflows/*.yml, examples/auto-triage.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh
