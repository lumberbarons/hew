name: publish-install

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - site/**
      - .github/workflows/publish-install.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: publish install.sh and the landing page to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git show main:install.sh > install.sh
          git show main:site/index.html > index.html
          git show main:site/robots.txt > robots.txt
          git show main:site/sitemap.xml > sitemap.xml
          git add install.sh index.html robots.txt sitemap.xml
          git commit -m "publish install.sh and site from main @ $(git rev-parse --short main)"
          git push --force origin gh-pages
