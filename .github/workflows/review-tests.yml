name: review-tests

# The review runs once per PR, not once per push. Reviewing on `synchronize`
# pays for a full re-derivation of every finding on each commit, including the
# commits that exist only to fix what the last review reported; a follow-up pass
# does occasionally surface something the first missed, but not reliably enough
# to be worth a review per push. Draft PRs are skipped entirely, so the single
# run lands when the PR is marked ready (or opened non-draft). Push a large
# batch of new tests after that and want another pass? Ask for one:
# `gh workflow run review-tests.yml -f pr=<number>`.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review again
        required: true

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: review-tests-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Explicit head ref so a manual re-review checks out the PR rather
          # than the branch the workflow was dispatched from.
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1

      # The workflow always runs so it reports a status on every PR, but the
      # review itself only has anything to do when the PR touches test files.
      # Gate the expensive step here rather than with an on.paths filter, which
      # would leave the check permanently pending on PRs that touch no tests.
      - name: detect scoped test changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          changed=$(gh pr diff "$PR_NUMBER" \
            --repo "${{ github.repository }}" --name-only)
          if printf '%s\n' "$changed" | grep -qE '(_test\.go$|^internal/render/testdata/)'; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test files in scope — skipping review."
          fi

      - name: review test quality
        if: steps.scope.outputs.has_tests == 'true'
        uses: anthropics/claude-code-action@af0559ee4f514d1ef21826982bed13f7edc3c35e # v1.0.178
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}
            COMMIT: ${{ steps.scope.outputs.sha }}

            Scope:
            - Run `gh pr diff ${{ env.PR_NUMBER }} --name-only` and keep
              only test files: `*_test.go` and files under `internal/render/testdata/`.
              Ignore files the PR deletes.
            - If the scope is only `internal/render/testdata/` files, add the
              `internal/render/*_test.go` files that use them — golden data is only
              reviewable alongside the tests that assert on it.
            - If nothing remains in scope, stop without commenting.

            Review the scoped files using the review-tests skill
            (.claude/skills/review-tests/SKILL.md). The PR branch is already checked out in
            the working directory, but HEAD is detached, so skip the skill's
            discover-files.sh scoping step — the file list above is the review scope. Follow
            the rest of the skill as written: the falsifiability bar and severity rules, what
            not to flag, pattern collapsing, the finding cap, and the REFERENCE.md output
            format.

            Focus: run `gh pr diff ${{ env.PR_NUMBER }}` and prioritize
            findings on lines this PR adds or modifies. For pre-existing code in the scoped
            files that this PR does not touch, report only P1 findings.

            Posting: post the report as a single PR comment using
            `gh pr comment ${{ env.PR_NUMBER }} --edit-last --create-if-none`, which
            replaces any earlier report of yours in place rather than adding a comment.
            This is a one-shot review of the whole branch — derive every finding fresh from
            the current state of the scoped files, and do not read the PR's comment thread
            to carry findings forward. Name the reviewed commit
            (${{ steps.scope.outputs.sha }}) in the report so a reader can tell whether
            later pushes have moved past it. If there are no findings, the comment is a
            one-line "no findings" note. This review is advisory: commenting is the only
            output — never request changes or fail the job.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*)"
