# The leanest hand-rolled query that answers "what is ready?" without hew.
#
# Deliberately charitable to the baseline: labels and assignees for
# priority/type/claim, subIssuesSummary to recognize epics, blockedBy with
# state so closed blockers can be discounted — and no bodies, no timestamps,
# no URLs, nothing the question doesn't need. An agent cannot get the same
# answer from fewer tokens than this.
#
# gh has no native equivalent: `gh issue list` cannot return blockedBy,
# parent, or sub-issues at all, which is why this query exists.
query($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    issues(states: [OPEN], first: 100) {
      pageInfo { hasNextPage endCursor }
      nodes {
        number
        title
        state
        labels(first: 50) { nodes { name } }
        assignees(first: 10) { nodes { login } }
        subIssuesSummary { total completed }
        blockedBy(first: 20) { totalCount nodes { number state } }
      }
    }
  }
}
