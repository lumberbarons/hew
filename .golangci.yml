version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # Renderers write to buffers/stdout; a failed write there is not
      # actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

# `default: standard` is errcheck/govet/ineffassign/staticcheck/unused — none of
# which look at formatting. These make `golangci-lint fmt` the formatting gate.
formatters:
  enable:
    - gofmt
    - goimports
