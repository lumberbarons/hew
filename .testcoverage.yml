# Coverage gate: statement coverage on every package but cmd/, which is wiring
# and excluded so the bar bites where behavior lives.
# Two profiles, merged by go-test-coverage: the root module's own tests, and the
# consumer/ module's scenarios measured against the root packages (-coverpkg),
# which are the only tests of much of pr and migrate. See the test job in
# .github/workflows/ci.yml.
profile: coverage.out,coverage-consumer.out

threshold:
  total: 90

# Keep the public library at the same floor even if internal/ coverage masks it.
override:
  - path: ^tracker($|/)
    threshold: 90

exclude:
  paths:
    - ^cmd/
